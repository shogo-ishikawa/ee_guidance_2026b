<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">実籾キャンパス2号館2階の概略図</title>
  <desc id="desc">上側に203、204、205、206、207教室が並び、右側の206教室と207教室を強調している。下側には201教室と202教室がある。</desc>
  <rect width="1200" height="540" rx="28" fill="#f4f7fa"/>
  <text x="60" y="72" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#123b5d">2号館 2階（概略）</text>
  <text x="1140" y="70" text-anchor="end" font-family="system-ui, sans-serif" font-size="22" fill="#516273">右側が206・207教室</text>

  <g font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <rect x="55" y="120" width="210" height="128" rx="12" fill="#ffffff" stroke="#9babb8" stroke-width="3"/>
    <text x="160" y="192" fill="#34495a">203教室</text>

    <rect x="278" y="120" width="210" height="128" rx="12" fill="#ffffff" stroke="#9babb8" stroke-width="3"/>
    <text x="383" y="192" fill="#34495a">204教室</text>

    <rect x="501" y="120" width="150" height="128" rx="12" fill="#ffffff" stroke="#9babb8" stroke-width="3"/>
    <text x="576" y="192" fill="#34495a">205</text>

    <rect x="664" y="112" width="235" height="144" rx="14" fill="#146a9d" stroke="#0e4e76" stroke-width="5"/>
    <text x="781.5" y="171" fill="#ffffff">206教室</text>
    <text x="781.5" y="211" fill="#ffffff" font-size="22">26B21001–21088</text>

    <rect x="912" y="112" width="233" height="144" rx="14" fill="#f2b84b" stroke="#8a5a00" stroke-width="5"/>
    <text x="1028.5" y="171" fill="#2b220f">207教室</text>
    <text x="1028.5" y="211" fill="#2b220f" font-size="22">26B21089–21176</text>
  </g>

  <rect x="55" y="282" width="1090" height="66" rx="18" fill="#dbe5ec"/>
  <text x="600" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#435566">廊下</text>

  <g font-family="system-ui, sans-serif" font-size="27" font-weight="700" text-anchor="middle">
    <rect x="280" y="380" width="260" height="105" rx="12" fill="#ffffff" stroke="#9babb8" stroke-width="3"/>
    <text x="410" y="445" fill="#34495a">201教室</text>
    <rect x="660" y="380" width="260" height="105" rx="12" fill="#ffffff" stroke="#9babb8" stroke-width="3"/>
    <text x="790" y="445" fill="#34495a">202教室</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="20" fill="#516273" text-anchor="middle">
    <text x="165" y="321">階段</text>
    <text x="1035" y="321">階段</text>
  </g>
  <text x="1140" y="512" text-anchor="end" font-family="system-ui, sans-serif" font-size="18" fill="#6b7d8b">※位置関係を示す概略図です。縮尺は正確ではありません。</text>
</svg>
